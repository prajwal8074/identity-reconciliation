name: Bitespeed Identity Reconciliation CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bitespeed_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Initialize Database Schema
      run: psql "postgresql://user:password@localhost/bitespeed_db" -f schema.sql

    - name: Start Flask App (Background)
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/bitespeed_db
      run: |
        python app.py > server.log 2>&1 &
        # give the server a few seconds to initialize and bind to port 3000
        sleep 5

    - name: Run Integration Tests
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/bitespeed_db
      run: |
        python test.py
